A:

Abkürzung: |
  Verfahren der Wortbildung, bei dem Wörter oder Wortgruppen verkürzt werden.

Ableitung (Derivation): |
  Wortbildungsprozess, bei dem durch Affixe neue Wörter entstehen.

Adjektiv: |
  Wortart zur Bezeichnung von Eigenschaften.

Allomorph: |
  Konkrete Variante eines Morphems in unterschiedlichen sprachlichen Kontexten.

Allophon: |
  Lautvariante eines Phonems ohne bedeutungsunterscheidende Funktion.

Assimilation: |
  Angleichung eines Lautes an einen Nachbarlaut.

  * Progressive Assimilation:** Der vorhergehende Laut beeinflusst den folgenden Laut.
  * Regressive Assimilation:** Der folgende Laut beeinflusst den vorhergehenden Laut.

Äußerung: |
  Sprachliche Einheit, die einen vollständigen Gedanken ausdrückt.

Autosemantika: |
  Inhaltswörter mit eigenständiger lexikalischer Bedeutung.



B:

Bezeichnetes (Signifikat / Signifié): |
  Inhaltliche Seite des sprachlichen Zeichens.

Bezeichnendes (Signifikant / Signifiant): |
  Formale bzw. lautliche Seite des sprachlichen Zeichens.

Binomina: |
  Mehrteilige Benennungen aus zwei Wörtern.



D:

Derivation: |
  Siehe Ableitung.

Distinktiv: |
  Bedeutungsunterscheidend.



E:

Elementarsatz: |
  Einfacher Satz mit Prädikat, eventuell ergänzt durch ein Subjekt.



F:

Flexion: |
  Veränderung von Wortformen zur Kennzeichnung grammatischer Kategorien.

Formenbildung: |
  Bildung grammatischer Wortformen innerhalb eines Paradigmas.

Funktionswort: |
  Wort mit grammatischer oder pragmatischer Funktion ohne eigene lexikalische Bedeutung.



G:

Graphem: |
  Kleinste bedeutungsunterscheidende Einheit der geschriebenen Sprache.

Graphemik: |
  Lehre von der Schrift und ihren kleinsten Einheiten.

Graph: |
  Konkretes Schriftzeichen bzw. Buchstabe.

Grammatische Kategorien: |
  Formale Eigenschaften von Wörtern, z. B. Numerus, Genus oder Tempus.



I:

Inhaltswort: |
  Wort mit eigenständiger lexikalischer Bedeutung.

Interlexikalische Beziehungen: |
  Beziehungen zwischen verschiedenen Wörtern.

Intralexikalische Beziehungen: |
  Beziehungen innerhalb eines Wortes oder seiner Bedeutungen.



K:

Koartikulation: |
  Veränderung von Lauten aufgrund ihrer lautlichen Umgebung.

Komposition: |
  Wortbildung durch Zusammensetzung mehrerer Wörter oder Stämme.

Konstituenz: |
  Hierarchische Gliederung sprachlicher Einheiten.



L:

Langage: |
  Allgemeine menschliche Sprachfähigkeit.

Langue: |
  Abstraktes Sprachsystem einer Sprachgemeinschaft.

Lautbild: |
  Akustische bzw. lautliche Form eines sprachlichen Zeichens.

Lexik: |
  Gesamtheit der Wörter mit lexikalischer Bedeutung.

Lexikalische Bedeutung: |
  Inhaltliche Bedeutung eines Wortes.

Lexikalische Wortbildung: |
  Bildung neuer Wörter mit neuer lexikalischer Bedeutung.

Lexikologie: |
  Wissenschaft vom Wortschatz einer Sprache.

Linearität: |
  Eigenschaft sprachlicher Zeichen, zeitlich nacheinander angeordnet zu sein.



M:

Modifikation: |
  Wortbildungsfunktion zur Veränderung der Bedeutung eines Wortes.

Morphem: |
  Kleinste bedeutungstragende Einheit der Sprache.

Morphematik / Morphemik: |
  Lehre von den Morphemen und ihren Eigenschaften.

Morphologie: |
  Lehre von Form und Struktur sprachlicher Einheiten.

Morphosyntax: |
  Zusammenspiel von Morphologie und Syntax.



P:

Paradigma: |
  Gesamtheit der grammatischen Formen eines Wortes.

Paradigmatische Beziehung: |
  Beziehung zwischen sprachlichen Elementen, die austauschbar sind.

Parole: |
  Konkreter Sprachgebrauch in realen Äußerungen.

Phonem: |
  Kleinste bedeutungsunterscheidende lautliche Einheit einer Sprache.

Phonetik: |
  Lehre von den Sprachlauten.

Phonologie: |
  Lehre von der Funktion der Sprachlaute innerhalb eines Sprachsystems.

Prädikat: |
  Satzglied, das eine Aussage über das Subjekt macht.

Prädikation: |
  Herstellung einer Aussagebeziehung im Satz.



S:

Semiotik: |
  Allgemeine Zeichenlehre.

Satzglied: |
  Funktionale Einheit innerhalb eines Satzes.

Signifikat: |
  Siehe Bezeichnetes.

Signifikant: |
  Siehe Bezeichnendes.

Sprachliches Zeichen: |
  Einheit aus Ausdrucksseite und Inhaltsseite.

Syntax: |
  Lehre von der Verbindung von Wörtern zu Sätzen.

Syntagmatische Beziehung: |
  Beziehung zwischen sprachlichen Elementen, die gemeinsam auftreten.

Synsemantika: |
  Funktionswörter ohne eigenständige lexikalische Bedeutung.



T:

Token: |
  Konkretes Auftreten einer sprachlichen Einheit.

Transposition: |
  Wortbildungsprozess mit Wechsel der Wortart.

Type: |
  Abstrakte sprachliche Einheit im Sprachsystem.



U:

Univerbierung: |
  Zusammenziehung mehrerer Wörter zu einem einzigen Wort.



V:

Vokabular: |
  Gesamtheit der Wörter einer Sprache.



W:

Wortart: |
  Klasse von Wörtern mit gemeinsamen grammatischen Eigenschaften.

Wortbildung: |
  Bildung neuer Wörter aus vorhandenen sprachlichen Mitteln.

Wortfamilie / Wortnest: |
  Gruppe formal und semantisch verwandter Wörter.

Wortform: |
  Konkrete grammatische Form eines Wortes.

Wortfügung: |
  Verbindung mehrerer Wortformen innerhalb einer syntaktischen Struktur.

Wortschatz: |
  Gesamtheit der Wörter einer Sprache.
