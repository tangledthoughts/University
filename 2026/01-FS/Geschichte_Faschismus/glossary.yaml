# Glossar zur Vorlesung Geschichte des Faschismus
eklektizistisch:  |
  den Eklektizismus betreffend, zum Eklektizismus gehörend

  Siehe auch: [[Eklektizismus]]

Eklektizismus:  |
  Inbegriff dafür, unterschiedliche, jeweils abgeschlossene Systeme (beispielsweise Kunststile oder Denkschulen verschiedener Traditionen beziehungsweise Zeiten) neu zusammenzufügen 

  unoriginelle, unschöpferische geistige oder künstlerische Arbeitsweise, bei der Ideen anderer übernommen oder zu einem System zusammengetragen werden

fascis:  |
  lat. Rutenbündel, Liktoren, Zeichen der Amtsgewalt und Amtswürde

fascio:  |
  ital. Bund

fascismo:  |
  ital. Bündlertum